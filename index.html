<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#9A3D78"><title>Calendário da Nina</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Roboto+Mono:wght@500&display=swap">

<style>
/* Layout: agenda de conteúdo — barra de abas no topo, grade mensal que vira lista no celular, gaveta lateral com o post do dia */
:root{
  --bg:#FBF7F9; --surface:#FFFFFF; --sunk:#F3EAF0; --line:#E7D8E1;
  --fg:#22171D; --muted:#6E5A66; --plum:#8A3470; --plum-strong:#7A2C5E; --rose:#EE9ACB; --lav:#6B7BFF;
  --car:#9A3D78; --car-bg:#FCEEF6; --reel:#5866D8; --reel-bg:#E8EAFE;
  --ok:#2F7D5B; --ok-bg:#E1F2E9; --warn:#9A6400;
  --display:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'Roboto Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17111A; --surface:#211923; --sunk:#2A202C; --line:#3A2D3C;
  --fg:#F4ECF1; --muted:#B9A6B3; --plum:#D9AFC8; --plum-strong:#E7C3D8; --rose:#EE9ACB; --lav:#9BA7FF;
  --car:#E0B3CE; --car-bg:#3A2834; --reel:#AEB6FF; --reel-bg:#2B2F55;
  --ok:#7FD3AA; --ok-bg:#1F3A2E; --warn:#F0C060; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17111A; --surface:#211923; --sunk:#2A202C; --line:#3A2D3C;
  --fg:#F4ECF1; --muted:#B9A6B3; --plum:#D9AFC8; --plum-strong:#E7C3D8; --rose:#EE9ACB; --lav:#9BA7FF;
  --car:#E0B3CE; --car-bg:#3A2834; --reel:#AEB6FF; --reel-bg:#2B2F55;
  --ok:#7FD3AA; --ok-bg:#1F3A2E; --warn:#F0C060; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--lav);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:44px;height:44px;border-radius:13px;background:#9A3D78;color:#FFF9F2;
  display:grid;place-items:center;font:700 24px var(--display)}
.brand h1{font:700 22px/1.1 var(--display);margin:0;text-wrap:balance}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
nav.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:999px;overflow-x:auto;max-width:100%}
nav.tabs button{border:0;background:transparent;padding:8px 16px;border-radius:999px;font-weight:500;color:var(--muted);white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.monthnav{display:flex;align-items:center;gap:8px}
.monthnav h2{font:600 20px var(--display);margin:0;min-width:170px;text-align:center;text-transform:capitalize}
.iconbtn{border:1px solid var(--line);background:var(--surface);width:36px;height:36px;border-radius:10px;display:grid;place-items:center}
.progress{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.meter{width:160px;height:8px;border-radius:999px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,#9A3D78,#6B7BFF);width:0}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.notice{font-size:13px;color:var(--warn)}
/* grade */
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dow{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:0 6px}
.day{min-height:118px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px;display:flex;flex-direction:column;gap:6px;text-align:left;min-width:0}
.day.out{background:transparent;border-style:dashed;opacity:.45}
.day.today{border-color:var(--lav);box-shadow:inset 0 0 0 1px var(--lav)}
.day .n{display:flex;justify-content:space-between;align-items:center;font:500 13px var(--mono);color:var(--muted)}
.hol{font:500 11px var(--body);color:var(--warn);text-align:right;line-height:1.2}
.chip{border:0;width:100%;text-align:left;border-radius:10px;padding:7px 8px;display:flex;flex-direction:column;gap:3px;min-width:0}
.chip.carrossel{background:var(--car-bg)}
.chip.reels{background:var(--reel-bg)}
.chip .t{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;display:flex;justify-content:space-between;gap:4px}
.chip.carrossel .t{color:var(--car)} .chip.reels .t{color:var(--reel)}
.chip .ti{font-size:13px;font-weight:500;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;color:var(--fg)}
.chip.done{opacity:.62}
.schip{border:1px dashed var(--line);background:transparent;width:100%;text-align:left;border-radius:10px;padding:4px 8px;font-size:11px;font-weight:600;color:var(--muted);display:flex;justify-content:space-between;gap:4px;margin-top:4px}
.schip.done{color:var(--ok);border-color:var(--ok)}
.story{display:grid;grid-template-columns:56px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.story:first-of-type{border-top:0}
.story .hr{font:500 13px var(--mono);color:var(--muted)}
.story .fm{display:inline-block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--plum);margin-bottom:2px}
.story .tx{font-weight:500}
.sart{display:block;margin-top:8px;width:96px;aspect-ratio:9/16;border:1px solid var(--line);border-radius:10px;overflow:hidden;padding:0;background:var(--sunk);cursor:zoom-in}
.sart img{width:100%;height:100%;object-fit:cover;display:block}
.story .fg,.story .ob{font-size:13px;color:var(--muted);margin-top:2px}
.story details{margin-top:6px}.story summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--plum)}
.chip.done .ti{text-decoration:line-through;text-decoration-color:var(--muted)}
.okpill{display:inline-flex;align-items:center;gap:3px;color:var(--ok);font-weight:700}
.clip{font-size:11px;color:var(--muted)}
.add{border:1px dashed var(--line);background:transparent;border-radius:10px;padding:6px;font-size:12px;color:var(--muted)}
.pf{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:860px){.pf{grid-template-columns:1fr}}
.phone{background:var(--surface);border:1px solid var(--line);border-radius:28px;overflow:hidden;max-width:420px;width:100%;margin:0 auto}
.ph-top{display:flex;align-items:center;justify-content:center;padding:14px 16px;font-weight:700;font-size:16px;border-bottom:1px solid var(--line)}
.ph-head{display:flex;align-items:center;gap:20px;padding:16px 16px 8px}
.ph-av{width:86px;height:86px;border-radius:50%;flex:none;padding:3px;background:var(--rose)}
.ph-av img{width:100%;height:100%;border-radius:50%;display:block;border:3px solid var(--surface)}
.ph-stats{flex:1;display:flex;justify-content:space-around;text-align:center;font-size:13px;color:var(--muted)}
.ph-stats b{display:block;font-size:17px;color:var(--fg)}
.ph-bio{padding:4px 16px 12px;font-size:14px;line-height:1.45;white-space:pre-line}
.ph-bio .nm{font-weight:600}.ph-bio .cat{color:var(--muted)}
.ph-bio a{color:var(--lav);font-weight:600;text-decoration:none}
.ph-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px 14px}
.ph-btns span{background:var(--sunk);border-radius:8px;text-align:center;padding:7px;font-weight:600;font-size:13px}
.ph-btns span:first-child{background:#6B7BFF;color:#fff}
.ph-hl{display:flex;gap:14px;padding:4px 16px 16px;overflow-x:auto}
.ph-hl div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;flex:none;width:66px;text-align:center}
.ph-hl i{width:62px;height:62px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;color:#FFF9F2;font:700 13px var(--display)}
.ph-tabs{display:flex;justify-content:space-around;border-top:1px solid var(--line);font-size:12px;color:var(--muted);padding:10px 0;font-weight:600}
.ph-tabs span:first-child{color:var(--fg)}
.ph-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.ph-grid button{padding:0;border:0;background:var(--sunk);position:relative;aspect-ratio:4/5;overflow:hidden}
.ph-grid img{width:100%;height:100%;object-fit:cover;display:block}
.ph-grid .tp{position:absolute;top:6px;right:6px;color:#fff;font-size:11px;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.ph-grid .ok{position:absolute;bottom:6px;left:6px;background:var(--ok-bg);color:var(--ok);font-size:10px;font-weight:600;border-radius:6px;padding:1px 6px}
.kv{display:flex;flex-direction:column;gap:4px}
.kv pre.copy{margin:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--plum-strong);color:#FFF9F2}
@media (max-width:760px){
  .grid{display:flex;flex-direction:column;gap:8px}
  .dow,.day.out,.day.empty{display:none}
  .day{min-height:0;flex-direction:row;align-items:flex-start;gap:12px}
  .day .n{flex-direction:column;align-items:flex-start;min-width:56px}
  .chip .ti{-webkit-line-clamp:2}
}
/* gaveta */
.scrim{position:fixed;inset:0;background:rgba(20,10,18,.45);z-index:20}
aside.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);z-index:21;overflow-y:auto;
  padding:calc(20px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) 20px;
  border-left:1px solid var(--line);display:flex;flex-direction:column;gap:18px;box-shadow:-12px 0 40px rgba(0,0,0,.18)}
.dhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.dhead h3{font:700 22px/1.2 var(--display);margin:4px 0 0;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:6px;font-size:12px}
.pill{border-radius:999px;padding:3px 10px;background:var(--sunk);color:var(--muted);font-weight:500}
.pill.carrossel{background:var(--car-bg);color:var(--car)} .pill.reels{background:var(--reel-bg);color:var(--reel)}
.donebox{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;font-weight:600}
.donebox input{width:22px;height:22px;accent-color:#2F7D5B}
.donebox small{font-weight:400;color:var(--muted);margin-left:auto}
section.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
section.card h4{font:600 15px var(--display);margin:0;display:flex;justify-content:space-between;align-items:center;gap:8px}
.slides{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.slides button{border:1px solid var(--line);padding:0;border-radius:10px;overflow:hidden;background:var(--sunk);aspect-ratio:4/5;max-width:100%}
.slides img{width:100%;height:100%;object-fit:cover;display:block}
.row{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:500;font-size:14px}
.btn.primary{background:var(--plum-strong);border-color:var(--plum-strong);color:var(--bg)}
.btn.small{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
pre.copy,textarea.cap{white-space:pre-wrap;word-wrap:break-word;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:12px;margin:0;font:400 14px/1.55 var(--body);max-height:320px;overflow:auto;width:100%}
textarea.cap{min-height:220px;resize:vertical}
ol.steps,ul.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.hint{font-size:12px;color:var(--muted)}
.att{display:flex;flex-direction:column;gap:10px}
.attitem{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px;min-width:0}
.attitem video,.attitem img{width:96px;height:120px;object-fit:cover;border-radius:8px;background:var(--sunk);flex:none}
.attitem .info{min-width:0;flex:1;display:flex;flex-direction:column;gap:4px;font-size:13px}
.attitem .info b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linkin{display:flex;gap:8px}
.linkin input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px}
.viewer{position:fixed;inset:0;z-index:30;background:rgba(10,5,9,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px}
.viewer img{max-height:80vh;max-width:100%;border-radius:12px}
.viewer .row{justify-content:center}
.viewer .btn{background:#FFF9F2;color:#22171D;border-color:#FFF9F2}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:40}
/* listas */
.month{display:flex;flex-direction:column;gap:12px}
.month h3{font:600 18px var(--display);margin:8px 0 0;text-transform:capitalize}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.acard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;text-align:left;padding:0}
.acard img,.acard video{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;background:var(--sunk)}
.acard .c{padding:10px;display:flex;flex-direction:column;gap:4px;font-size:13px}
.acard .c b{font-size:13px;line-height:1.3}
.acard .c span{color:var(--muted);font-family:var(--mono);font-size:12px}
.rlist{display:flex;flex-direction:column;gap:12px}
details.r{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
details.r summary{cursor:pointer;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-weight:600}
details.r summary span{font:500 12px var(--mono);color:var(--muted)}
details.r[open]{display:flex;flex-direction:column;gap:12px}
.empty{color:var(--muted);font-size:14px;padding:16px;border:1px dashed var(--line);border-radius:var(--r);text-align:center}
@media (prefers-reduced-motion:no-preference){aside.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
</style>

    h('div',{class:'info'}, h('b',{},mm.name||mm.url||'Arquivo'),
      h('span',{class:'hint'}, [mm.size?(mm.size/1048576).toFixed(1)+' MB':null, mm.at?new Date(mm.at).toLocaleDateString('pt-BR'):null].filter(Boolean).join(' · ')),
      h('div',{class:'row'},

        state.dbOk? h('button',{class:'btn small',onclick:()=>removeMedia(mm)},'Remover') : null)));
}
async function upload(files, ds, month){
  if (!assets||!db){ toast('Envio indisponível nesta visualização'); return; }
  for (const f of files){
    if (f.size > 20*1024*1024){ toast(`${f.name}: acima de 20 MB. Salve o link do vídeo.`); continue; }
    toast('Enviando '+f.name+'…');
    try{
      const r = await assets.upload(f);
      const id = 'm'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
      await db.doc('media/'+id).set({date:ds||null, month:month||(ds?ds.slice(0,7):null), assetId:r.id, contentType:r.contentType, size:r.sizeBytes, name:f.name, at:Date.now()});
      toast('Enviado');
    }catch(e){ toast(e&&e.code==='unsupported_type'?'Formato não aceito':e&&e.code==='too_large'?'Arquivo grande demais':'Não foi possível enviar'); }
  }
}
async function addLink(url, ds, month){
  url=(url||'').trim(); if(!/^https:\/\//.test(url)){ toast('Cole um link que comece com https://'); return; }
  const id='m'+Date.now().toString(36);
  try{ await db.doc('media/'+id).set({date:ds||null, month:month||(ds?ds.slice(0,7):null), url, name:url, contentType:'link', at:Date.now()}); toast('Link salvo'); }catch(e){ toast('Não foi possível salvar'); }
}
async function removeMedia(mm){
  try{ await db.doc('media/'+mm.id).delete(); if (mm.assetId && assets){ try{ await assets.delete(mm.assetId); }catch(e){} } toast('Removido'); }catch(e){ toast('Não foi possível remover'); }
}
async function setDone(ds, v){
  try{ await db.doc('status/'+ds).set({done:v, at:Date.now()}); toast(v?'Marcado como postado':'Desmarcado'); }catch(e){ toast('Não foi possível salvar'); }
}
function viewArt(ds,i,list){
  const files=list||ART[ds]; let k=i;
  const img=h('img',{src:'art/'+files[k],alt:''});
  const label=h('span',{style:'color:#FFF9F2;font:500 14px var(--mono)'},`${k+1}/${files.length}`);
  const go=d=>{ k=(k+d+files.length)%files.length; img.src='art/'+files[k]; label.textContent=`${k+1}/${files.length}`; };

/* ---------- exportar para o Drive ---------- */
const exp = { running:false, done:0, total:0, msg:'' };
const driveName = d => { const p=byDate[d]; return `${d} · ${p.type==='reels'?'Reels':'Carrossel'} · ${p.title}`.replace(/[\/:*?"<>|]/g,'-').slice(0,120); };
async function driveCall(input){
  const r = await mcp.callTool('Google Drive','create_file',input,{cache:false});
  const p = r.payload||{}; const id = p.id || (p.file&&p.file.id); if(!id) throw {code:'tool_error',message:'Sem id na resposta'}; return {id, url:p.viewUrl||null};
}
async function exportDrive(){
  if (exp.running) return; if(!mcp||!db){ toast('Abra pelo claude.ai para exportar'); return; }
  let fileArgs=false; try{ fileArgs=!!(await mcp.listTools()).fileArgs; }catch(e){}
  if(!fileArgs){ exp.msg='Esta visualização não envia arquivos. Abra o calendário no claude.ai pelo navegador ou app atualizado.'; render(); return; }
  const jobs=[]; for (const d of Object.keys(ART).sort()) for (const f of ART[d]) jobs.push([d,f]);
  jobs.push(['_perfil','nina-perfil.jpg']);
  exp.running=true; exp.total=jobs.length; exp.done=jobs.filter(([d,f])=>state.drive[f]).length; exp.msg=''; render();
  try{
    for (const [d,f] of jobs){
      if (state.drive[f]) continue;
      const fk='_folder-'+d; let folder = state.drive[fk] && state.drive[fk].id;
      if (!folder){ const r = await driveCall({title: d==='_perfil'?'Perfil':driveName(d), contentMimeType:'application/vnd.google-apps.folder', parentId:DRIVE_ROOT});
        folder=r.id; state.drive[fk]={id:r.id,url:r.url}; await db.doc('drive/'+fk).set({id:r.id,url:r.url,date:d,at:Date.now()}); }
      const blob = await (await fetch('art/'+f)).blob();
      const r = await driveCall({title:f, contentMimeType:'image/jpeg', disableConversionToGoogleType:true, parentId:folder, base64Content:{$file:{data:blob,name:f,type:'image/jpeg'}}});
      state.drive[f]={id:r.id}; await db.doc('drive/'+f).set({id:r.id,folder,date:d,at:Date.now()});
      exp.done++; render();
    }
    exp.msg='Pronto: todas as artes estão no Drive.'; toast('Artes enviadas para o Drive');
  }catch(e){
    const c=e&&e.code;
    exp.msg = c==='server_not_connected'?'Conecte o Google Drive em claude.ai, Configurações › Conectores, e tente de novo.'
      : c==='needs_reauth'?'Reconecte o Google Drive em claude.ai, Configurações › Conectores.'
      : (c==='not_in_manifest'||c==='approval_required')?'O envio precisa da sua autorização para o Google Drive. Clique de novo e permita.'
      : 'O envio parou no meio. Clique de novo: ele continua de onde parou.';
  }
  exp.running=false; render();
}
async function downloadAllZip(){
  if (!window.JSZip){ toast('Não foi possível montar o .zip agora'); return; }
  exp.zipping=true; exp.msg='Preparando o .zip com todas as artes…'; render();
  try{
    const zip=new JSZip();
    for (const d of Object.keys(ART).sort()){ const fo=zip.folder(driveName(d)); for (const f of ART[d]){ const r=await fetch('art/'+f); fo.file(f, await r.blob()); } }
    for (const d of Object.keys(STORIES).sort()){ const fs=STORIES[d].filter(y=>y.art); if(!fs.length) continue; const fo=zip.folder('Stories').folder(d); for (const y of fs){ const r=await fetch('art/'+y.art); fo.file(y.art, await r.blob()); } }
    const r=await fetch('art/nina-perfil.jpg'); zip.folder('Perfil').file('nina-perfil.jpg', await r.blob());
    const blob=await zip.generateAsync({type:'blob'});
    await save('Nina-artes-nov-dez-2026.zip', blob);
    exp.msg='No Drive, abra a pasta “Nina · Calendário de conteúdo”, clique em Novo › Upload de pasta e escolha a pasta descompactada.';
  }catch(e){ exp.msg='Não foi possível montar o .zip agora. Tente de novo.'; }
  exp.zipping=false; render();
}
function exportCard(){
  const pct = exp.total? Math.round(exp.done/exp.total*100):0;
  const sent = Object.keys(state.drive||{}).filter(k=>!k.startsWith('_folder')).length;
  return h('section',{class:'card'},
    h('h4',{},'Enviar as artes para o Google Drive'),
    h('div',{style:'display:flex;gap:8px;flex-wrap:wrap'},
      h('button',{class:'btn small primary',disabled:exp.running||!mcp,onclick:exportDrive}, exp.running?`Enviando ${exp.done}/${exp.total}…`:'Enviar para o Drive'),
      h('button',{class:'btn small',disabled:exp.zipping,onclick:downloadAllZip}, exp.zipping?'Montando o .zip…':'Baixar tudo em .zip')),
    mcp ? h('p',{class:'hint',style:'margin:0'},'Cria uma pasta por post dentro de “Nina · Calendário de conteúdo” no seu Drive. Na primeira vez, permita o acesso ao Google Drive. Se parar no meio, é só clicar de novo.')
        : h('p',{class:'hint',style:'margin:0'},'O envio direto para o Drive só funciona abrindo este calendário em claude.ai, no navegador do computador, com o conector Google Drive ligado. Aqui, use “Baixar tudo em .zip” e suba a pasta no Drive.'),
    sent? h('p',{class:'hint',style:'margin:0'},`${sent} artes já estão no Drive.`):null,
    exp.total? h('div',{class:'progress'}, h('span',{class:'meter','aria-hidden':'true'}, h('i',{style:`width:${pct}%`})), h('span',{},`${exp.done} de ${exp.total}`)) : null,
    exp.msg? h('p',{style:'margin:0'},exp.msg):null);
}

(async()=>{
  const C = window.claude; if(!C||!C.use){ $('#dbnote').hidden=false; return; }
  const [d,a,dl,mc] = await Promise.all([C.use('db'),C.use('assets'),C.use('downloads'),C.use('mcp')]);
  db=d; assets=a; downloads=dl; mcp=mc; state.assetsOk=!!a;
  if(!db){ $('#dbnote').hidden=false; render(); return; }
  state.dbOk=true;
  const err = e => { if(e&&e.code==='revoked'){ state.dbOk=false; render(); } };
  db.collection('status').onSnapshot(s=>{ state.status=Object.fromEntries(s.docs.map(x=>[x.id,x.data()])); render(); }, err);
  db.collection('drive').onSnapshot(s=>{ state.drive=Object.fromEntries(s.docs.map(x=>[x.id,x.data()])); if(!exp.running) render(); }, err);
  db.collection('stories').onSnapshot(s=>{ state.stories=Object.fromEntries(s.docs.map(x=>[x.id,x.data()])); render(); }, err);
  db.collection('captions').onSnapshot(s=>{ state.captions=Object.fromEntries(s.docs.map(x=>[x.id,x.data()])); render(); }, err);
  db.collection('media').onSnapshot(s=>{ state.media=s.docs.map(x=>({id:x.id,...x.data()})); render(); }, err);
  render();
})();
